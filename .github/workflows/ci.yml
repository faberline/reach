# CI stages follow aw docs/standards/ci.md: lint -> test-* -> gate.
# A ruleset (when one is added) requires only `gate`; do not rename it.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: never
jobs:
  lint:
    name: "lint: fmt, clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test-linux:
    name: "test: linux (lib, offline)"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --lib
      - run: cargo test --locked --test ax_incomplete_docs --test bin_platform_split --test calibration_docs --test ci_workflow --test docs_links --test docs_public_paths --test import_hygiene --test platform_boundary --test provenance_manifest --test virtual_input --test window_identity_docs
  test-macos:
    name: "test: macos (workspace)"
    needs: [lint]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sh build-capture.sh
      - run: sh build-cursor-overlay.sh
      - run: sh build-agent.sh
      - run: sh build-agent-app.sh --adhoc
      - run: cargo test --workspace --locked --no-fail-fast
  gate:
    name: gate
    if: always()
    needs: [lint, test-linux, test-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Show results
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
      - name: lint must pass
        run: |
          echo "$RESULTS" | jq -e '.lint.result == "success"'
      - name: every job passed or was skipped
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
